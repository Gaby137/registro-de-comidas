# Uso:
#   Desarrollo:  docker compose up db -d          (solo MySQL; la app se corre con ./mvnw)
#   Producción:  docker compose up -d --build     (MySQL + app, lee variables de .env)
#
# Los contenedores y volúmenes toman el nombre de la carpeta del proyecto (o de COMPOSE_PROJECT_NAME),
# así varios proyectos creados desde el kit conviven sin pisarse.
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-comidas_db}
      MYSQL_USER: ${DB_USER:-appuser}
      MYSQL_PASSWORD: ${DB_PASS:-apppass}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    ports:
      # Solo accesible desde esta máquina (para la app en dev y clientes SQL), nunca desde afuera
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      # Por TCP: mientras se inicializa, MySQL levanta un servidor temporal que solo escucha por socket
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:mysql://db:3306/${DB_NAME:-comidas_db}
      DB_USER: ${DB_USER:-appuser}
      DB_PASS: ${DB_PASS:-apppass}
      APP_NOMBRE: ${APP_NOMBRE:-Comidas}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      UPLOAD_DIR: /app/uploads
      # Zona horaria de la JVM (fechas de alta, logs)
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - uploads_data:/app/uploads

volumes:
  db_data:
  uploads_data:
