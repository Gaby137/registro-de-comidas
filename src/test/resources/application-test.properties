# === TEST PROFILE ===
# H2 en memoria en modo MySQL: Flyway corre las mismas migraciones que en prod
# y Hibernate las valida contra las entidades (si una migración falta, los tests fallan).
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.show-sql=false
spring.thymeleaf.cache=false

app.upload.dir=target/test-uploads
