# =====================================================================
# Configuración común a todos los perfiles.
# Lo específico de cada entorno va en application-{dev,prod}.properties.
# Todo valor sensible se lee de variables de entorno (ver .env.example).
# =====================================================================
# Nombre técnico del proyecto (aparece en los logs)
spring.application.name=comidas
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# === App (cambiar por proyecto) ===
app.nombre=${APP_NOMBRE:Comidas}
# Directorio PRIVADO de las fotos: nunca exponerlo como recurso estático (ver FotoStorageService)
app.fotos.dir=${FOTOS_DIR:fotos-privadas}

# === Cuenta del dueño ===
# Si no existe ningún ADMIN al arrancar, se crea con estos datos (ver DataInitializer)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# === Sesión ===
# La app instalada queda abierta en el celular: sesión larga + cookie remember-me (ver SecurityConfig)
server.servlet.session.timeout=30d

# === Base de datos ===
# El esquema lo maneja Flyway (src/main/resources/db/migration). Hibernate solo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Las fechas (Instant) se guardan en UTC, sin importar la zona de la JVM ni de MySQL
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Mismo mapeo en MySQL y en H2 (tests): Instant -> DATETIME, UUID -> VARCHAR(36)
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=VARCHAR

# === Thymeleaf ===
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# === Fotos ===
# El celular comprime antes de subir (1600 px, JPEG ~80 %): una foto pesa bastante menos que esto
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.resolve-lazily=true

# === Actuator: solo health (para Docker / balanceadores) ===
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# === Errores: nunca exponer stack traces ni mensajes internos ===
server.error.include-stacktrace=never
server.error.include-message=never
