# =====================================================================
# Configuración común a todos los perfiles.
# Lo específico de cada entorno va en application-{dev,prod}.properties.
# Todo valor sensible se lee de variables de entorno (ver .env.example).
# =====================================================================
# Nombre técnico del proyecto (aparece en los logs)
spring.application.name=comidas
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# === App (cambiar por proyecto) ===
app.nombre=${APP_NOMBRE:Comidas}
app.upload.dir=${UPLOAD_DIR:uploads}

# === Admin inicial ===
# Si no existe ningún ADMIN al arrancar, se crea con estos datos (ver DataInitializer)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# === Base de datos ===
# El esquema lo maneja Flyway (src/main/resources/db/migration). Hibernate solo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# === Thymeleaf ===
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# === Uploads ===
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.resolve-lazily=true

# === Actuator: solo health (para Docker / balanceadores) ===
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# === Errores: nunca exponer stack traces ni mensajes internos ===
server.error.include-stacktrace=never
server.error.include-message=never
