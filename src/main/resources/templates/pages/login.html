<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Iniciar sesión</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<main layout:fragment="content">
    <div class="auth-container">
        <div class="auth-card">
            <h1>Iniciar sesión</h1>

            <div th:replace="~{fragments/alertas :: alertas}"></div>

            <div th:if="${param.error}" class="alert alert-error">
                Email o contraseña incorrectos.
            </div>
            <div th:if="${param.logout}" class="alert alert-info">
                Cerraste sesión correctamente.
            </div>

            <form th:action="@{/login}" method="post" class="auth-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="contrasena">Contraseña</label>
                    <input type="password" id="contrasena" name="contrasena" required
                           autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary btn-full">Ingresar</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
