<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<main layout:fragment="content">
    <div class="auth-container">
        <div class="auth-card">
            <h2>Iniciar Sesión</h2>

            <div th:replace="~{fragments/alertas :: alertas}"></div>

            <div th:if="${param.error}" class="alert alert-error">
                Email o contraseña incorrectos, o la cuenta está desactivada.
            </div>
            <div th:if="${param.logout}" class="alert alert-info">
                Cerraste sesión correctamente.
            </div>

            <form th:action="@{/login}" method="post" class="auth-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required
                           placeholder="tu@email.com" autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="contrasena">Contraseña</label>
                    <input type="password" id="contrasena" name="contrasena" required
                           placeholder="••••••" autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary btn-full">Ingresar</button>
            </form>

            <p class="auth-link">
                ¿No tenés cuenta? <a th:href="@{/registro}">Registrate</a>
            </p>
        </div>
    </div>
</main>
</body>
</html>
