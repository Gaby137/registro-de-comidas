<!DOCTYPE html>
<!--
  Plantilla de listado para el panel admin: filtros por GET + tabla + paginación + acciones POST.
  Para un ABM nuevo: copiar este archivo y AdminUsuarioController, y reemplazar los campos.
-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin-base}">
<head>
    <title>Usuarios</title>
</head>
<body>
<h1 layout:fragment="page-title">Usuarios</h1>
<div layout:fragment="content">

    <!-- Filtros: se envían como query params, el controller los pasa al Specification -->
    <form th:action="@{/admin/usuarios}" method="get" class="filtros">
        <input type="search" name="q" th:value="${q}" placeholder="Buscar por nombre, apellido o email">
        <select name="rol">
            <option value="">Todos los roles</option>
            <option th:each="r : ${roles}" th:value="${r}" th:text="${r}" th:selected="${r == rol}"></option>
        </select>
        <select name="activo">
            <option value="">Todos los estados</option>
            <option value="true" th:selected="${activo == true}">Activos</option>
            <option value="false" th:selected="${activo == false}">Inactivos</option>
        </select>
        <button type="submit" class="btn btn-primary btn-sm">Filtrar</button>
        <a th:href="@{/admin/usuarios}" class="btn btn-text btn-sm">Limpiar</a>
    </form>

    <div class="tabla-wrapper">
        <table class="tabla">
            <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Email</th>
                <th>Rol</th>
                <th>Estado</th>
                <th>Alta</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${pagina.content}">
                <td th:text="${u.id}">1</td>
                <td th:text="|${u.nombre} ${u.apellido}|">Juan Pérez</td>
                <td th:text="${u.email}">juan@mail.com</td>
                <td><span class="badge" th:text="${u.rol}">USER</span></td>
                <td>
                    <span th:if="${u.activo}" class="estado estado-activo">Activo</span>
                    <span th:unless="${u.activo}" class="estado estado-inactivo">Inactivo</span>
                </td>
                <td th:text="${u.creadoEn != null ? #temporals.format(u.creadoEn, 'dd/MM/yyyy') : '-'}">01/01/2026</td>
                <td class="acciones">
                    <form th:action="@{/admin/usuarios/{id}/estado(id=${u.id})}" method="post">
                        <input type="hidden" name="activo" th:value="${!u.activo}">
                        <button type="submit" class="btn btn-outline btn-sm"
                                th:text="${u.activo ? 'Desactivar' : 'Activar'}">Desactivar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${pagina.empty}">
                <td colspan="7" class="vacio">No hay usuarios que coincidan con los filtros.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Paginación: conserva los filtros actuales -->
    <nav class="paginacion" th:if="${pagina.totalPages > 1}">
        <a th:if="${pagina.hasPrevious()}" class="btn btn-outline btn-sm"
           th:href="@{/admin/usuarios(q=${q},rol=${rol},activo=${activo},page=${pagina.number - 1})}">← Anterior</a>
        <span th:text="|Página ${pagina.number + 1} de ${pagina.totalPages} (${pagina.totalElements} resultados)|"></span>
        <a th:if="${pagina.hasNext()}" class="btn btn-outline btn-sm"
           th:href="@{/admin/usuarios(q=${q},rol=${rol},activo=${activo},page=${pagina.number + 1})}">Siguiente →</a>
    </nav>
</div>
</body>
</html>
