<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Registro</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<main layout:fragment="content">
    <div class="auth-container">
        <div class="auth-card">
            <h2>Crear Cuenta</h2>

            <div th:replace="~{fragments/alertas :: alertas}"></div>

            <form th:action="@{/registro}" th:object="${registroRequest}" method="post" class="auth-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" th:field="*{nombre}" required placeholder="Juan">
                        <span class="field-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
                    </div>
                    <div class="form-group">
                        <label for="apellido">Apellido</label>
                        <input type="text" id="apellido" th:field="*{apellido}" required placeholder="Pérez">
                        <span class="field-error" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}"></span>
                    </div>
                </div>
                <div class="form-group">
                    <label for="reg-email">Email</label>
                    <input type="email" id="reg-email" th:field="*{email}" required placeholder="tu@email.com">
                    <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                </div>
                <div class="form-group">
                    <label for="reg-contrasena">Contraseña</label>
                    <input type="password" id="reg-contrasena" th:field="*{contrasena}" required
                           placeholder="Mínimo 8 caracteres" minlength="8">
                    <span class="field-error" th:if="${#fields.hasErrors('contrasena')}" th:errors="*{contrasena}"></span>
                </div>
                <div class="form-group">
                    <label for="telefono">Teléfono <span class="optional">(opcional)</span></label>
                    <input type="tel" id="telefono" th:field="*{telefono}" placeholder="+54 11 1234-5678">
                    <span class="field-error" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></span>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Registrarse</button>
            </form>

            <p class="auth-link">
                ¿Ya tenés cuenta? <a th:href="@{/login}">Iniciá sesión</a>
            </p>
        </div>
    </div>
</main>
</body>
</html>
