<!DOCTYPE html>
<!-- Layout mínimo para las páginas sin sesión: login y error. -->
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0f766e">

    <title layout:title-pattern="$CONTENT_TITLE · $LAYOUT_TITLE" th:text="${appNombre}">Comidas</title>

    <link rel="manifest" th:href="@{/manifest.webmanifest}">
    <link rel="icon" type="image/png" sizes="192x192" th:href="@{/icons/icono-192.png}">
    <link rel="apple-touch-icon" th:href="@{/icons/apple-touch-icon.png}">
    <link rel="stylesheet" th:href="@{/css/global.css}">

    <th:block layout:fragment="custom-css"></th:block>
</head>
<body>

    <header class="barra-simple" th:text="${appNombre}">Comidas</header>

    <main layout:fragment="content">
    </main>

    <th:block layout:fragment="scripts"></th:block>
</body>
</html>
