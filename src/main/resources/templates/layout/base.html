<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" th:content="${appNombre}" content="Mi App">

    <!-- CSRF para HTMX / fetch (ver script al final) -->
    <meta name="_csrf" th:if="${_csrf}" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:if="${_csrf}" th:content="${_csrf.headerName}"/>

    <title layout:title-pattern="$CONTENT_TITLE | $LAYOUT_TITLE" th:text="${appNombre}">Mi App</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/global.css}">

    <th:block layout:fragment="custom-css"></th:block>

    <!-- HTMX (opcional): versión fija + integrity (si el CDN sirviera otro archivo, el navegador no lo ejecuta) -->
    <script src="https://unpkg.com/htmx.org@2.0.11/dist/htmx.min.js"
            integrity="sha384-2OatzQy1H+Zd/IIrjr1TcuDGqLXeHhbooAyJY1KdQMKnr4LZ22k31GBLdYKHmVjg"
            crossorigin="anonymous" defer></script>
</head>
<body>

    <header th:replace="~{fragments/header :: header}"></header>

    <main layout:fragment="content">
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script>
        // Mobile menu
        document.addEventListener('DOMContentLoaded', function() {
            const menuBtn = document.getElementById('mobileMenuBtn');
            const navLinks = document.getElementById('navLinks');
            if (menuBtn && navLinks) {
                menuBtn.addEventListener('click', function() {
                    navLinks.classList.toggle('active');
                    menuBtn.classList.toggle('active');
                });
            }
        });

        // HTMX + CSRF: agrega el token a cada request de HTMX (POST/PUT/DELETE lo necesitan)
        document.body.addEventListener('htmx:configRequest', (event) => {
            const csrfHeader = document.querySelector("meta[name='_csrf_header']");
            const csrfToken = document.querySelector("meta[name='_csrf']");
            if (csrfHeader && csrfToken) {
                event.detail.headers[csrfHeader.content] = csrfToken.content;
            }
        });
    </script>

    <th:block layout:fragment="scripts"></th:block>
</body>
</html>
