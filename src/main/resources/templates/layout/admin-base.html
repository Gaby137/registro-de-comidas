<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSRF para HTMX / fetch -->
    <meta name="_csrf" th:if="${_csrf}" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:if="${_csrf}" th:content="${_csrf.headerName}"/>

    <title layout:title-pattern="$CONTENT_TITLE — Admin">Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <script src="https://unpkg.com/htmx.org@2.0.11/dist/htmx.min.js"
            integrity="sha384-2OatzQy1H+Zd/IIrjr1TcuDGqLXeHhbooAyJY1KdQMKnr4LZ22k31GBLdYKHmVjg"
            crossorigin="anonymous" defer></script>
    <th:block layout:fragment="head"></th:block>
</head>
<body class="admin-body">

<aside class="admin-sidebar">
    <div class="sidebar-header">
        <h2 th:text="${appNombre}">Panel Admin</h2>
        <span class="badge badge-admin">ADMIN</span>
    </div>
    <nav class="sidebar-nav">
        <ul>
            <li>
                <a th:href="@{/admin}" th:classappend="${requestURI == '/admin' ? 'active' : ''}">
                    📊 Dashboard
                </a>
            </li>
            <li>
                <a th:href="@{/admin/usuarios}" th:classappend="${#strings.startsWith(requestURI, '/admin/usuarios') ? 'active' : ''}">
                    👥 Usuarios
                </a>
            </li>
            <!-- Agregar más links del admin aquí -->
        </ul>
    </nav>
    <div class="sidebar-footer">
        <div class="admin-user-info">
            <span class="admin-avatar" th:text="${#strings.toUpperCase(#strings.substring(#authentication.name,0,1))}">A</span>
            <span class="admin-email" th:text="${#authentication.name}">admin@app.com</span>
        </div>
        <form th:action="@{/logout}" method="post" class="mt-sm">
            <button type="submit" class="btn btn-outline btn-full btn-sm">Cerrar Sesión</button>
        </form>
        <a th:href="@{/}" class="btn btn-text btn-full btn-sm mt-xs" target="_blank">Ver Sitio ↗</a>
    </div>
</aside>

<main class="admin-main">
    <header class="admin-topbar">
        <h1 layout:fragment="page-title">Panel de Administración</h1>
    </header>
    <div class="admin-content">
        <div th:replace="~{fragments/alertas :: alertas}"></div>
        <div layout:fragment="content"></div>
    </div>
</main>

<script>
    // HTMX + CSRF
    document.body.addEventListener('htmx:configRequest', (event) => {
        const csrfHeader = document.querySelector("meta[name='_csrf_header']");
        const csrfToken = document.querySelector("meta[name='_csrf']");
        if (csrfHeader && csrfToken) {
            event.detail.headers[csrfHeader.content] = csrfToken.content;
        }
    });
</script>
<th:block layout:fragment="scripts"></th:block>
</body>
</html>
