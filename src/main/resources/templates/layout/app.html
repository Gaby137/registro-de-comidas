<!DOCTYPE html>
<!-- Layout del dueño: pensado primero para el celular (PWA instalada). -->
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">

    <!-- CSRF para fetch (ver static/js/app.js) -->
    <meta name="_csrf" th:if="${_csrf}" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:if="${_csrf}" th:content="${_csrf.headerName}"/>

    <!-- PWA: instalable en la pantalla de inicio y a pantalla completa -->
    <link rel="manifest" th:href="@{/manifest.webmanifest}">
    <meta name="theme-color" content="#0f766e">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Comidas">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="icon" type="image/png" sizes="192x192" th:href="@{/icons/icono-192.png}">
    <link rel="apple-touch-icon" th:href="@{/icons/apple-touch-icon.png}">

    <title layout:title-pattern="$CONTENT_TITLE · $LAYOUT_TITLE" th:text="${appNombre}">Comidas</title>

    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/comidas.css}">
</head>
<body class="app">

<header class="app-barra">
    <a th:href="@{/}" class="app-marca" th:text="${appNombre}">Comidas</a>

    <!-- En el celular esta navegación queda fija abajo; en pantallas anchas, acá en la barra -->
    <nav class="app-nav" aria-label="Secciones">
        <a th:href="@{/}" th:attr="aria-current=${requestURI == '/' ? 'page' : null}">Hoy</a>
        <a th:href="@{/semana}"
           th:attr="aria-current=${#strings.startsWith(requestURI, '/semana') or #strings.startsWith(requestURI, '/registros') ? 'page' : null}">Semana</a>
        <a th:href="@{/platos}"
           th:attr="aria-current=${#strings.startsWith(requestURI, '/platos') ? 'page' : null}">Platos</a>
        <a th:href="@{/link}"
           th:attr="aria-current=${#strings.startsWith(requestURI, '/link') ? 'page' : null}">Link</a>
    </nav>

    <form th:action="@{/logout}" method="post">
        <button type="submit" class="btn btn-text btn-sm">Salir</button>
    </form>
</header>

<main class="app-contenido">
    <div th:replace="~{fragments/alertas :: alertas}"></div>
    <div layout:fragment="content"></div>
</main>

<script th:src="@{/js/app.js}"></script>
<th:block layout:fragment="scripts"></th:block>
</body>
</html>
