<!DOCTYPE html>
<!--
  Página de error única. La usan:
  - Spring Boot (BasicErrorController) para 404, 403, 500, etc. → model: status, error, path
  - GlobalExceptionHandler → model: status, errorMessage
  También la ve la nutricionista si el link fue revocado: por eso no muestra login ni navegación.
-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      layout:decorate="~{layout/base}">
<head>
    <title>Error</title>
</head>
<body>
<main layout:fragment="content">
    <div class="error-container" th:with="codigo=${status ?: 500}">
        <h1 class="error-code" th:text="${codigo}">500</h1>
        <p class="error-message" th:if="${errorMessage}" th:text="${errorMessage}">Error</p>
        <p class="error-message" th:unless="${errorMessage}" th:switch="${codigo}">
            <span th:case="404">La página que buscás no existe.</span>
            <span th:case="403">No tenés permisos para acceder a esta página.</span>
            <span th:case="400">La solicitud no es válida.</span>
            <span th:case="405">La acción solicitada no está permitida.</span>
            <span th:case="*">Ocurrió un error inesperado. Por favor, intentá más tarde.</span>
        </p>
        <a sec:authorize="isAuthenticated()" th:href="@{/}" class="btn btn-primary">Volver al inicio</a>
    </div>
</main>
</body>
</html>
