<header th:fragment="header" class="site-header"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
    <div class="header-container">
        <a th:href="@{/}" class="logo" th:text="${appNombre}">Mi App</a>

        <button id="mobileMenuBtn" class="mobile-menu-btn" aria-label="Menú">
            <span></span><span></span><span></span>
        </button>

        <nav id="navLinks" class="nav-links">
            <a th:href="@{/}" th:classappend="${requestURI == '/' ? 'active' : ''}">Inicio</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}">Panel Admin</a>

            <div sec:authorize="isAnonymous()" class="nav-auth">
                <a th:href="@{/login}" class="btn btn-outline btn-sm">Iniciar Sesión</a>
                <a th:href="@{/registro}" class="btn btn-primary btn-sm">Registrarse</a>
            </div>

            <div sec:authorize="isAuthenticated()" class="nav-auth">
                <span class="nav-user" sec:authentication="name">usuario</span>
                <form th:action="@{/logout}" method="post" style="display:inline">
                    <button type="submit" class="btn btn-outline btn-sm">Salir</button>
                </form>
            </div>
        </nav>
    </div>
</header>
