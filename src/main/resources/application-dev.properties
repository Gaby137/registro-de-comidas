# === DEV PROFILE ===
# Pensado para: docker compose up db -d  +  ./mvnw spring-boot:run

# Lee el .env del proyecto (si existe): mismas credenciales y puertos que usa docker compose.
# Las variables de entorno del sistema siguen teniendo prioridad sobre el .env.
spring.config.import=optional:file:.env[.properties]

server.port=${APP_PORT:8080}

# Database (MySQL del docker-compose; sin .env usa los mismos defaults que docker-compose.yml)
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:${DB_PORT:3307}/${DB_NAME:comidas_db}}
spring.datasource.username=${DB_USER:appuser}
spring.datasource.password=${DB_PASS:apppass}
spring.jpa.show-sql=true

# Clave de la cookie remember-me (en prod es obligatoria y distinta: REMEMBER_ME_KEY)
app.remember-me.key=${REMEMBER_ME_KEY:clave-solo-para-desarrollo-no-usar-en-produccion}

# Thymeleaf sin cache para ver cambios en templates sin reiniciar
spring.thymeleaf.cache=false

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.comidas=DEBUG
