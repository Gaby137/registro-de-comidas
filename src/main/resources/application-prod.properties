# === PROD PROFILE ===
# Todas las variables son obligatorias: si falta alguna, la app no arranca (mejor que arrancar mal).

# Database
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.jpa.show-sql=false

# Thymeleaf con cache
spring.thymeleaf.cache=true

# Cookies de sesión seguras (requiere HTTPS, normalmente vía proxy reverso)
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Respetar X-Forwarded-* del proxy reverso (Nginx, Traefik, Cloudflare...)
server.forward-headers-strategy=native

# Logging
logging.level.org.springframework.security=WARN
logging.level.com.comidas=INFO
